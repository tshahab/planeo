services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@database:5432/ticketing
      SESSION_SECRET: docker-development-secret-change-before-production
      NEXT_TELEMETRY_DISABLED: "1"
      npm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
      - attachment_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

  email-worker:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://ticketing:ticketing@database:5432/ticketing
      EMAIL_PROVIDER_URL: http://mail-capture:8025/messages
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      database:
        condition: service_healthy
      mail-capture:
        condition: service_started
    command: ["sh", "-c", "pnpm db:generate && pnpm db:deploy && pnpm email:worker"]

  mail-capture:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ops/mail-capture.mjs:/app/mail-capture.mjs:ro
    ports:
      - "8025:8025"
    command: ["node", "/app/mail-capture.mjs"]

volumes:
  app_node_modules:
  pnpm_store:
  postgres_data:
  attachment_storage:
