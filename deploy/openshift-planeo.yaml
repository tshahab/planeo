apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: planeo
  namespace: planeo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: planeo
  namespace: planeo
spec:
  runPolicy: SerialLatestOnly
  source:
    binary: {}
  strategy:
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: planeo:build-output
  triggers: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planeo-postgres
  namespace: planeo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planeo-attachments
  namespace: planeo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: planeo-db
  namespace: planeo
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: planeo
spec:
  selector: {app: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: planeo
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      serviceAccountName: planeo-db
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              value: planeo
            - name: POSTGRES_USER
              value: planeo
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: planeo-runtime, key: POSTGRES_PASSWORD}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U planeo -d planeo']}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{name: data, persistentVolumeClaim: {claimName: planeo-postgres}}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: planeo-migrate
  namespace: planeo
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app: planeo-migrate}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/planeo/planeo:release-placeholder
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          command: [node, node_modules/prisma/build/index.js, migrate, deploy]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: planeo-runtime, key: DATABASE_URL}}
---
apiVersion: v1
kind: Service
metadata:
  name: planeo
  namespace: planeo
spec:
  selector: {app: planeo}
  ports: [{name: http, port: 80, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planeo
  namespace: planeo
spec:
  replicas: 1
  selector: {matchLabels: {app: planeo}}
  template:
    metadata: {labels: {app: planeo}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/planeo/planeo:release-placeholder
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          imagePullPolicy: Always
          ports: [{containerPort: 3000}]
          envFrom: [{secretRef: {name: planeo-runtime}}]
          volumeMounts: [{name: attachments, mountPath: /app/storage}]
          readinessProbe:
            httpGet: {path: /api/health/ready, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health/live, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes: [{name: attachments, persistentVolumeClaim: {claimName: planeo-attachments}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: planeo-email-worker, namespace: planeo}
spec:
  replicas: 1
  selector: {matchLabels: {app: planeo-worker, worker: email}}
  template:
    metadata: {labels: {app: planeo-worker, worker: email}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      automountServiceAccountToken: false
      volumes:
        - name: smtp-ca
          secret:
            secretName: planeo-smtp-ca
            optional: true
      containers:
        - name: email
          image: image-registry.openshift-image-registry.svc:5000/planeo/planeo:release-placeholder
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: {type: RuntimeDefault}
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: smtp-ca, mountPath: /etc/planeo/smtp-ca, readOnly: true}
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: planeo-runtime, key: DATABASE_URL}}}
            - {name: EMAIL_PROVIDER_URL, valueFrom: {secretKeyRef: {name: planeo-runtime, key: EMAIL_PROVIDER_URL, optional: true}}}
            - {name: SMTP_HOST, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_HOST, optional: true}}}
            - {name: SMTP_PORT, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_PORT, optional: true}}}
            - {name: SMTP_FROM, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_FROM, optional: true}}}
            - {name: SMTP_SECURE, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_SECURE, optional: true}}}
            - {name: SMTP_REQUIRE_TLS, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_REQUIRE_TLS, optional: true}}}
            - {name: SMTP_TLS_REJECT_UNAUTHORIZED, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_TLS_REJECT_UNAUTHORIZED, optional: true}}}
            - {name: SMTP_TLS_CERT_FINGERPRINTS, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_TLS_CERT_FINGERPRINTS, optional: true}}}
            - {name: NODE_EXTRA_CA_CERTS, value: /etc/planeo/smtp-ca/ca.crt}
            - {name: SMTP_USERNAME, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_USERNAME, optional: true}}}
            - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: planeo-runtime, key: SMTP_PASSWORD, optional: true}}}
          command: [node, ops/email-worker.mjs]
---
